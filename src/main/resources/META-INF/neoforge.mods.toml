modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"
logoFile="firstaid_logo.png"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description="${mod_description}"
credits="Original First Aid by ichttt. Initial idea developed together with TechnikForLife; the original textures were designed by rozarke; the new texture set was drawn by enderdream."

[[accessTransformers]]
file="META-INF/accesstransformer.cfg"

[[mixins]]
config="firstaid.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="playerrevive"
type="optional"
versionRange="[2.1.0,)"
ordering="NONE"
side="BOTH"
