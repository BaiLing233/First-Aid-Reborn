plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_archive_name
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// PlayerRevive is an optional integration: drop its jar into libs/ to compile the bridge.
// Without it the two bridge sources are skipped and the mod keeps the no-op handler.
def playerReviveJar = file('libs/PlayerRevive_NEOFORGE_v2.1.2_mc1.21.1.jar')
def playerReviveCompat = playerReviveJar.exists()

if (playerReviveCompat) {
    logger.lifecycle("First Aid Reborn: PlayerRevive compatibility enabled (${playerReviveJar.name})")
} else {
    logger.lifecycle("First Aid Reborn: PlayerRevive jar not found in libs/, the compatibility bridge will be skipped")
    sourceSets.main.java.exclude 'ichttt/mods/firstaid/common/compat/playerrevive/PRPresentCompatHandler.java'
    sourceSets.main.java.exclude 'ichttt/mods/firstaid/common/compat/playerrevive/PlayerReviveEventHandler.java'
}

dependencies {
    if (playerReviveCompat) {
        compileOnly files(playerReviveJar)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xmaxerrs' << '4000'
    options.encoding = 'UTF-8'
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            data()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Only neoforge.mods.toml contains placeholders, everything else is copied verbatim.
// Note: expand runs the Groovy template engine, so any other resource that happens to contain
// "${...}" would be evaluated as an expression and break the build.
processResources {
    filesMatching('META-INF/neoforge.mods.toml') {
        expand project.properties
    }
}

jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
